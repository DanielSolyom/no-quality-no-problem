name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y lua5.4 luarocks && sudo luarocks install luacheck
      - run: luacheck .
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n build.sh publish.sh scripts/*.sh

  versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        run: echo "versions=$(python3 scripts/factorio-releases.py ci)" >> "$GITHUB_OUTPUT"

  game:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        factorio: ${{ fromJSON(needs.versions.outputs.versions) }}
    uses: ./.github/workflows/validate.yml
    with:
      factorio: ${{ matrix.factorio }}
