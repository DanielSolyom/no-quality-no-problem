name: Release to mod portal

# Publication is part of the successful main CI run, never triggered by a tag.
on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      mod_version:
        required: true
        type: string
      release_date:
        required: true
        type: string
      engine:
        required: true
        type: string
    secrets:
      FACTORIO_API_KEY:
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Tag and publish the tested patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_KIND: main
      FACTORIO_VERSION: ${{ inputs.engine }}
      MOD_VERSION: ${{ inputs.mod_version }}
      RELEASE_DATE: ${{ inputs.release_date }}
      RELEASE_BRANCH: main
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: factorio-${{ inputs.engine }}-space-age
          path: /tmp/validated
      - name: Commit, tag and publish the exact tested archive
        env:
          FACTORIO_API_KEY: ${{ secrets.FACTORIO_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-tested.sh "/tmp/validated/dist/no-quality-no-problem_$MOD_VERSION.zip"
