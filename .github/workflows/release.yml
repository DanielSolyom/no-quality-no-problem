name: Release to mod portal

# Tag with the mod version, e.g.  git tag v1.1.0 && git push --tags
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  MOD_DIR: no-quality-no-problem

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - factorio: "2.1.17"
            target: "2.1"
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches info.json
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version "$MOD_DIR/info.json")
          TAG="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "$TAG" ] || { echo "tag $TAG != info.json $VERSION"; exit 1; }

      # Never publish something that does not load.
      - name: Cache Factorio headless
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/factorio-${{ matrix.factorio }}
          key: factorio-headless-${{ matrix.factorio }}

      - name: Download Factorio headless
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fSL "https://factorio.com/get-download/${{ matrix.factorio }}/headless/linux64" -o /tmp/factorio.tar.xz
          mkdir -p ~/factorio-${{ matrix.factorio }}
          tar -xJf /tmp/factorio.tar.xz -C ~/factorio-${{ matrix.factorio }} --strip-components=1

      - name: Test
        env:
          FACTORIO_BIN: /home/runner/factorio-${{ matrix.factorio }}/bin/x64/factorio
          TARGET_FV: ${{ matrix.target }}
        run: scripts/ci-test.sh all

      # Uploads the zip, and (once) pushes the portal page content from
      # portal.json so the mod page is reproducible from git. Needs a key with
      # the usages "ModPortal: Upload Mods" + "ModPortal: Edit Mods".
      - name: Publish
        env:
          FACTORIO_API_KEY: ${{ secrets.FACTORIO_API_KEY }}
        run: ./publish.sh "$MOD_DIR" --sync-details

  # Mirror the release on GitHub: the same zip the portal got, plus the
  # changelog entry for this version as release notes.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build zip
        run: ./build.sh "$MOD_DIR"

      - name: Extract changelog entry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            /^Version: /  { p = ($2 == v); next }
            /^-{20,}/     { p = 0; next }
            p' "$MOD_DIR/changelog.txt" > /tmp/notes.md
          [ -s /tmp/notes.md ] || echo "See changelog.txt." > /tmp/notes.md
          echo "Mod portal: https://mods.factorio.com/mod/$MOD_DIR" >> /tmp/notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md --verify-tag
